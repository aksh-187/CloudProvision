<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudProvision</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .redir { text-align:center; color:var(--color-text-muted); font-size:var(--text-sm); }
    .spinner-lg { width:32px;height:32px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto var(--space-4); }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="redir">
    <div class="spinner-lg"></div>
    <p>Loading CloudProvision…</p>
  </div>
  <script>
  (async () => {
    try {
      const res = await fetch('/api/auth/me', { credentials: 'include' });
      window.location.href = res.ok ? '/dashboard.html' : '/login.html';
    } catch {
      window.location.href = '/login.html';
    }
  })();
  </script>
</body>
</html>
