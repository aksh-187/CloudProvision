<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CloudProvision</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">CP</div>
      <span class="auth-logo-text">CloudProvision</span>
    </div>

    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Access your infrastructure dashboard.</p>

    <div id="login-alert" class="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
          autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
          autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-4" type="submit" id="login-btn">
        Sign in
      </button>
    </form>

    <div class="divider-text mt-6">or</div>
    <p class="text-center text-sm text-muted">
      Don't have an account? <a href="/signup.html">Create one</a>
    </p>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
  'use strict';
  // If already logged in, go to dashboard
  (async () => {
    const user = await getCurrentUser();
    if (user) window.location.href = '/dashboard.html';
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    hideAlert('login-alert');
    setButtonLoading(btn, 'Signing in…');

    try {
      await api.post('/auth/login', {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = '/dashboard.html';
    } catch (err) {
      showAlert('login-alert', err.message || 'Sign in failed. Please try again.');
      setButtonReady(btn);
    }
  });
  </script>
</body>
</html>
