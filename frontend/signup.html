<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CloudProvision</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">CP</div>
      <span class="auth-logo-text">CloudProvision</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start provisioning cloud infrastructure.</p>

    <div id="signup-alert" class="alert"></div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input class="form-input" type="text" id="name" name="name"
          autocomplete="name" placeholder="Jane Smith" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
          autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
          autocomplete="new-password" placeholder="Minimum 8 characters"
          required minlength="8" />
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm password</label>
        <input class="form-input" type="password" id="confirm" name="confirm"
          autocomplete="new-password" placeholder="Repeat your password" required />
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-4" type="submit" id="signup-btn">
        Create account
      </button>
    </form>

    <div class="divider-text mt-6">or</div>
    <p class="text-center text-sm text-muted">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
  'use strict';
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    hideAlert('signup-alert');

    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    if (password !== confirm) {
      showAlert('signup-alert', 'Passwords do not match.');
      return;
    }
    if (password.length < 8) {
      showAlert('signup-alert', 'Password must be at least 8 characters.');
      return;
    }

    setButtonLoading(btn, 'Creating account…');
    try {
      await api.post('/auth/signup', {
        name:     document.getElementById('name').value.trim(),
        email:    document.getElementById('email').value.trim(),
        password,
      });
      showAlert('signup-alert', 'Account created! Redirecting to sign in…', 'success');
      setTimeout(() => { window.location.href = '/login.html'; }, 1200);
    } catch (err) {
      showAlert('signup-alert', err.message || 'Sign up failed. Please try again.');
      setButtonReady(btn);
    }
  });
  </script>
</body>
</html>
