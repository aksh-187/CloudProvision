<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CloudProvision</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">CP</div>
      <span class="auth-logo-text">CloudProvision</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start provisioning cloud infrastructure.</p>

    <div id="signup-alert" class="alert" role="alert"></div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input
          class="form-input"
          type="text"
          id="name"
          name="name"
          autocomplete="name"
          placeholder="Jane Smith"
          required
        />
        <span class="form-error" id="name-error"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />
        <span class="form-error" id="email-error"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          placeholder="Minimum 8 characters"
          required
          minlength="8"
        />
        <span class="form-error" id="password-error"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm password</label>
        <input
          class="form-input"
          type="password"
          id="confirm-password"
          name="confirmPassword"
          autocomplete="new-password"
          placeholder="Repeat your password"
          required
        />
        <span class="form-error" id="confirm-password-error"></span>
      </div>

      <button class="btn btn-primary btn-full btn-lg mt-4" type="submit" id="signup-btn">
        Create account
      </button>
    </form>

    <div class="divider-text mt-6">or</div>

    <p class="text-center text-sm text-muted">
      Already have an account?
      <a href="/login.html">Sign in</a>
    </p>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Full implementation in Phase 7.
    // Stub: wire form submit → POST /api/auth/signup
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      hideAlert('signup-alert');

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        showAlert('signup-alert', 'Passwords do not match.');
        return;
      }

      setButtonLoading(btn, 'Creating account…');

      try {
        await api.post('/auth/signup', { name, email, password });
        showAlert('signup-alert', 'Account created! Redirecting to sign in…', 'success');
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch (err) {
        showAlert('signup-alert', err.message || 'Sign up failed. Please try again.');
        setButtonReady(btn);
      }
    });
  </script>
</body>
</html>
